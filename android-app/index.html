<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and gesture bar;
         the CSS then pads content back with env(safe-area-inset-*).
         user-scalable=no because pinch-zooming a synced player is never wanted
         and on Android it silently breaks fixed layouts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08090b" />
    <title>Razzy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
